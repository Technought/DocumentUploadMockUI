<div
  class="mx-auto flex min-h-dvh w-full max-w-[1200px] flex-col gap-6 px-4 pt-6 pb-10 sm:px-6"
  [class]="tone()"
>
  <header class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-5">
    <div class="flex items-center gap-3">
      <div class="flex size-10 items-center justify-center border border-accent text-accent">
        <svg
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
          <path d="M14 3v5h5" />
          <path d="M9 13h6" />
          <path d="M9 17h4" />
        </svg>
      </div>
      <div class="flex flex-col gap-0.5">
        <p class="font-mono text-[11px] tracking-[0.18em] text-slate-400 uppercase">PDF to DOCX</p>
        <h1 class="text-[22px] leading-tight font-semibold tracking-wide">Document generation</h1>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <div
        class="flex min-h-11 items-center gap-2 border border-slate-800 bg-slate-900 px-3 font-mono text-xs tracking-wider text-slate-300 uppercase"
      >
        <span
          class="size-2 rounded-full"
          [class]="store.stream() === 'live' ? 'animate-blink bg-accent' : 'bg-slate-400'"
        ></span>
        Stream {{ store.stream() }}
      </div>
      <button
        type="button"
        class="flex min-h-11 cursor-pointer items-center gap-2 border border-slate-700 bg-slate-900 px-4 text-sm font-medium tracking-wider uppercase transition-colors hover:border-accent hover:text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-50"
        (click)="store.openInstructions()"
      >
        <svg
          class="size-[18px]"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7" />
          <path d="M12 17h.01" />
        </svg>
        How it works
      </button>
    </div>
  </header>

  <main class="flex flex-wrap items-stretch gap-6">
    <app-upload-panel class="min-w-0 flex-[1_1_320px]" />
    <app-status-panel class="min-w-0 flex-[2_1_480px]" />
  </main>
</div>

<app-instructions-dialog />
<app-disclaimer-dialog />
