<dialog
  [appModal]="store.instructionsOpen()"
  (dismissed)="store.closeInstructions()"
  aria-labelledby="instructions-title"
  class="m-auto max-h-[calc(100dvh-2rem)] w-[min(35rem,calc(100vw-2rem))] overflow-y-auto border border-slate-700 bg-slate-900 text-slate-200 shadow-[0_0_60px_-12px_var(--accent)] backdrop:bg-scrim backdrop:backdrop-blur-[3px] open:animate-pop open:backdrop:animate-fade"
>
  <!-- Padding lives on this wrapper: a click on the <dialog> element itself counts as a backdrop click. -->
  <div class="relative flex flex-col gap-6 p-8">
    <span class="absolute top-0 left-0 size-3.5 border-t-2 border-l-2 border-accent"></span>
    <span class="absolute right-0 bottom-0 size-3.5 border-r-2 border-b-2 border-accent"></span>

    <div class="flex items-start justify-between gap-4">
      <div class="flex flex-col gap-1">
        <p class="font-mono text-xs tracking-[0.18em] text-accent uppercase">Instructions</p>
        <h2 id="instructions-title" class="text-[28px] leading-[1.15] font-bold">How it works</h2>
      </div>
      <button
        type="button"
        aria-label="Close instructions"
        class="flex size-11 shrink-0 cursor-pointer items-center justify-center border border-slate-700 text-slate-300 transition-colors hover:border-accent hover:text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-50"
        (click)="store.closeInstructions()"
      >
        <svg
          class="size-[18px]"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M6 6l12 12" />
          <path d="M18 6L6 18" />
        </svg>
      </button>
    </div>

    <ol class="flex flex-col gap-4">
      @for (step of steps; track step.title) {
        <li class="flex animate-rise gap-4" [style.animation-delay.ms]="50 + $index * 50">
          <span
            class="flex size-8 shrink-0 items-center justify-center border border-accent font-mono text-[13px] font-bold text-accent"
          >
            {{ $index + 1 }}
          </span>
          <div class="flex flex-col gap-0.5">
            <p class="font-semibold">{{ step.title }}</p>
            <p class="text-sm text-slate-300">{{ step.text }}</p>
          </div>
        </li>
      }
    </ol>

    <button
      type="button"
      autofocus
      class="min-h-12 cursor-pointer self-end border border-accent bg-accent px-7 py-3 text-[15px] font-bold tracking-[0.08em] text-slate-950 uppercase transition hover:shadow-[0_0_28px_-4px_var(--accent)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-50"
      (click)="store.closeInstructions()"
    >
      Got it
    </button>
  </div>
</dialog>
